[package]
name = "perp-indexer"
version = "0.1.0"
license = "Apache-2.0"
publish = false
edition = "2024"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
diesel = { workspace = true, features = ["postgres", "serde_json"] }
diesel-async = { workspace = true, features = ["bb8", "postgres"] }
prometheus.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
url.workspace = true

haneul-indexer-alt-framework.workspace = true
haneul-indexer-alt-metrics.workspace = true
haneul-pg-db.workspace = true
haneul-types.workspace = true
move-core-types.workspace = true
telemetry-subscribers.workspace = true

perp-events.workspace = true
perp-schema.workspace = true

[[bin]]
name = "perp-indexer"
path = "src/main.rs"
