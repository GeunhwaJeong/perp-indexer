[workspace]
resolver = "2"
members = ["crates/types", "crates/indexer", "crates/schema", "crates/api"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "matched-path", "query", "tokio", "ws"] }
bcs = "0.1.6"
bigdecimal = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive", "env"] }
diesel = { version = "2.3", features = ["64-column-tables"] }
diesel-async = "0.9"
diesel_migrations = "2.3"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
hex = "0.4"
num-bigint = "0.4"
prometheus = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = "1.0"
tokio = "1.47"
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "timeout"] }
tracing = "0.1"
url = "2.5"

perp-types = { path = "crates/types" }
perp-schema = { path = "crates/schema" }

# Haneul is pinned to one commit so that the framework, the checkpoint types and the node this
# indexer reads from stay in step. Move every entry together.
haneul-field-count = { git = "https://github.com/GeunhwaJeong/haneul", rev = "71a73158707ee7ebcbee95229856da129311fa93" }
haneul-indexer-alt-framework = { git = "https://github.com/GeunhwaJeong/haneul", rev = "71a73158707ee7ebcbee95229856da129311fa93" }
haneul-indexer-alt-metrics = { git = "https://github.com/GeunhwaJeong/haneul", rev = "71a73158707ee7ebcbee95229856da129311fa93" }
haneul-pg-db = { git = "https://github.com/GeunhwaJeong/haneul", rev = "71a73158707ee7ebcbee95229856da129311fa93" }
haneul-types = { git = "https://github.com/GeunhwaJeong/haneul", rev = "71a73158707ee7ebcbee95229856da129311fa93" }
move-core-types = { git = "https://github.com/GeunhwaJeong/haneul", rev = "71a73158707ee7ebcbee95229856da129311fa93" }
telemetry-subscribers = { git = "https://github.com/GeunhwaJeong/haneul", rev = "71a73158707ee7ebcbee95229856da129311fa93" }
